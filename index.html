function load(){try{let x={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};x.tabOrder=Array.isArray(x.tabOrder)?x.tabOrder.filter(t=>t!=='finances'):[];if(!x.tabOrder.length)x.tabOrder=[...defaults.tabOrder];if(!Array.isArray(x.habits))x.habits=structuredClone(defaults.habits);if(!x.completions||typeof x.completions!=='object')x.completions={};if(!Array.isArray(x.transactions))x.transactions=[];if(!Array.isArray(x.events))x.events=[];if(!Array.isArray(x.organizers))x.organizers=structuredClone(defaults.organizers);if(!Array.isArray(x.tasks))x.tasks=[];if(!Array.isArray(x.financeCategories)||!x.financeCategories.length)x.financeCategories=[...defaults.financeCategories];if(!x.financeGoals||typeof x.financeGoals!=='object')x.financeGoals={};return x}catch{return structuredClone(defaults)}}function save(){localStorage.setItem(KEY,JSON.stringify(d));if(account.user)accountSync().catch(()=>{})}function theme(){let t=d.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):d.theme;document.documentElement.classList.toggle('dark',t==='dark')}matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',theme);
function zone(){return d.timezone==='auto'?Intl.DateTimeFormat().resolvedOptions().timeZone:d.timezone}function now(){return new Date()}function dateParts(){return new Intl.DateTimeFormat('en-GB',{timeZone:zone(),weekday:'long',day:'2-digit',month:'long',year:'numeric'}).formatToParts(now())}function clock(){return new Intl.DateTimeFormat('en-US',{timeZone:zone(),hour:'numeric',minute:'2-digit',hour12:true}).format(now())}function header(){let p=dateParts(),o=Object.fromEntries(p.map(x=>[x.type,x.value]));let nav=d.tabOrder.map((x,i)=>(i?' <span class="navdot"></span> ':'')+'<button type="button" class="'+(tab===x?'active':'')+'" data-tab="'+x+'">'+x.toUpperCase()+'</button>').join('');return '<header class="header"><div class="identity"><div class="name" id="name">'+esc(d.name)+'</div><div class="quote" id="quote">'+esc(d.quote)+'</div></div><nav class="nav">'+nav+'</nav><div class="datebox"><strong>'+o.weekday+'</strong><strong>'+o.day+' '+o.month.toUpperCase()+' '+o.year+'</strong><span class="time">'+clock()+'</span></div></header>'}
function monthKey(){return `${month.getFullYear()}-${pad(month.getMonth()+1)}`}function days(){return new Date(month.getFullYear(),month.getMonth()+1,0).getDate()}function monthName(){return new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(month).toUpperCase()}function monthNav(){return `<div class="monthnav"><button data-month="prev">‹</button><h2>${monthName()}</h2><button data-month="next">›</button></div>`}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ring(p,label,cls=''){p=Number.isFinite(Number(p))?Math.max(0,Math.min(100,Number(p))):0;let r=82,c=2*Math.PI*r,off=c*(1-p/100);return `<div class="ring ${cls}" data-ring style="width:${cls?'210':'190'}px;height:${cls?'210':'190'}px"><svg viewBox="0 0 190 190"><circle class="ring-track" cx="95" cy="95" r="${r}"/><circle class="ring-value" cx="95" cy="95" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="ring-center"><strong>${Math.round(p)}%</strong><span>${label}</span></div></div>`}
function habitView(){let ds=days(),k=monthKey(),c=d.completions[k]||{},hs=[...d.habits].sort((a,b)=>a.order-b.order),total=hs.length*ds,done=hs.reduce((s,h)=>s+Object.values(c[h.id]||{}).filter(Boolean).length,0),p=total?done/total*100:0,streak=0;for(let day=ds;day>0;day--){if(hs.length&&hs.every(h=>c[h.id]?.[day]))streak++;else if(streak)break}let cols=`220px repeat(${ds},32px)`;return `<section class="workspace"><div class="workspace-top">${monthNav()}<span class="eyebrow">${ds} DAYS · ${done}/${total||0} COMPLETIONS</span></div><div class="habit-intro"><div class="intro-copy"><span class="eyebrow">MONTHLY PRACTICE</span><div class="intro-title">Consistency, not intensity.</div><p>Your month is built from ordinary days. Mark what you did, keep the record, and let the pattern speak for itself.</p></div>${ring(p,'THIS MONTH')}<div class="stats"><div class="stat"><span>STREAK</span><strong>${streak} days</strong></div><div class="stat"><span>HABITS</span><strong>${hs.length}</strong></div><div class="stat"><span>COMPLETION</span><strong>${Math.round(p)}%</strong></div></div></div><div class="habit-table"><div class="habit-header" style="grid-template-columns:${cols}"><div>HABIT</div>${Array.from({length:ds},(_,i)=>`<div>${pad(i+1)}</div>`).join('')}</div>${hs.map((h,idx)=>`<div class="habit-row" style="grid-template-columns:${cols}"><div class="habit-name"><span>${esc(h.name)}</span><span class="habit-actions"><button data-hmove="${h.id}:up">↑</button><button data-hmove="${h.id}:down">↓</button><button data-hrename="${h.id}">✎</button><button data-hdelete="${h.id}">×</button></span></div>${Array.from({length:ds},(_,i)=>`<button class="dot ${c[h.id]?.[i+1]?'done':''}" data-dot="${h.id}:${i+1}"><span></span></button>`).join('')}</div>`).join('')}</div><div class="addline"><button class="add-btn" id="add-habit">＋ ADD HABIT</button><span class="eyebrow">CLICK A CIRCLE TO RECORD THE DAY</span></div></section>`}
function convertToBase(amount,cur){if(cur===d.baseCurrency)return amount;return amount}function fmt(n,c=d.baseCurrency){return `${currencies[c]||c}${Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}`}function autoCategory(desc){let v=(desc||'').toLowerCase();let rules=[['Groceries',['apple','bread','milk','grocery','groceries','supermarket','vegetable','fruit']],['Transport',['bus','taxi','uber','metro','train','fuel','transport']],['Education',['book','course','university','college','study','education']],['Daily Life',['coffee','restaurant','lunch','dinner','pharmacy','shopping']],['Savings',['save','savings','deposit','investment']]];for(let [cat,words] of rules)if(words.some(w=>v.includes(w)))return cat;return 'Other'}
function transactionRow(x,cats){return `<div class="transaction" data-tx-row="${x.id}"><input class="tx-input" data-tx-field="description" value="${esc(x.description)}"><div class="tx-amount"><button class="tx-type ${x.type==='income'?'income':''}" data-tx-type="${x.id}" title="Toggle income/expense">${x.type==='income'?'+':'−'}</button><input class="tx-input" data-tx-field="amount" type="number" step="0.01" value="${x.amount}"><select class="tx-select tx-cur" data-tx-field="currency">${Object.keys(currencies).map(c=>`<option ${x.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><select class="tx-select" data-tx-field="category">${cats.map(c=>`<option ${x.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input class="tx-input" data-tx-field="date" type="date" value="${x.date}"><button class="tx-delete" data-tx-delete="${x.id}" aria-label="Delete transaction">×</button></div>`}
function newTransactionRow(cats){return `<div class="transaction tx-new" data-new-tx><input class="tx-input" id="new-desc" placeholder="Add transaction…"><div class="tx-amount"><input class="tx-input" id="new-amount" type="number" step="0.01" placeholder="Amount"><select class="tx-select tx-cur" id="new-cur">${Object.keys(currencies).map(c=>`<option ${d.baseCurrency===c?'selected':''}>${c}</option>`).join('')}</select></div><select class="tx-select" id="new-cat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input class="tx-input" id="new-date" type="date" value="${monthKey()}-${pad(Math.min(new Date().getDate(),days()))}"><span></span></div>`}
function financeView(){let k=monthKey(),all=d.transactions.filter(x=>x.date?.startsWith(k)),tx=selectedFinanceCategory?all.filter(x=>x.category===selectedFinanceCategory):all,income=all.filter(x=>x.type==='income').reduce((s,x)=>s+convertToBase(x.amount,x.currency),0),expense=all.filter(x=>x.type==='expense').reduce((s,x)=>s+convertToBase(x.amount,x.currency),0),saved=Math.max(0,income-expense),transacted=income+expense,goal=Number(d.financeGoals?.[k]||0),progress=goal>0?Math.min(100,Math.max(0,saved/goal*100)):0,cats=[...new Set([...d.financeCategories,...all.map(x=>x.category).filter(Boolean)])];return `<section class="workspace"><div class="workspace-top">${monthNav()}<span class="eyebrow">${all.length} TRANSACTIONS · ${d.baseCurrency} BASE</span></div><div class="finance-layout"><div class="finance-main"><div class="finance-body"><div class="sectionbar"><h3>TRANSACTIONS</h3><span class="eyebrow">${selectedFinanceCategory?esc(selectedFinanceCategory):'ALL'} · EDIT DIRECTLY</span></div><div class="transaction" style="border-bottom:1px solid var(--line);font-size:9px;letter-spacing:.12em;color:var(--muted)"><span>ITEM</span><span>AMOUNT</span><span>CATEGORY</span><span>DATE</span><span></span></div>${tx.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>transactionRow(x,cats)).join('')}${newTransactionRow(cats)}<div class="inline-hint">TYPE ITEM + AMOUNT, THEN PRESS ENTER · NEW ROWS CAN BE ADDED INDEFINITELY</div></div></div><aside class="finance-side"><div class="finance-goal-wrap"><div class="finance-center"><div class="finance-ring savings-goal-ring" style="--goal-progress:${progress}"><svg viewBox="0 0 190 190" aria-label="Monthly savings goal progress"><defs><linearGradient id="savingsGoalGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#b52b2b"/><stop offset="55%" stop-color="#e59b2f"/><stop offset="100%" stop-color="#3d8f55"/></linearGradient></defs><circle class="finance-ring-track" cx="95" cy="95" r="78"/><circle class="finance-arc savings-goal-arc" cx="95" cy="95" r="78" pathLength="100" stroke-dasharray="${progress} 100"/></svg><div class="ring-center"><strong>${fmt(saved)}</strong><span>SAVED THIS MONTH</span></div></div></div><div class="finance-goal"><span>SAVINGS GOAL</span><div class="goal-edit"><span>${currencies[d.baseCurrency]||d.baseCurrency}</span><input id="finance-goal-input" type="number" min="0" step="1" value="${goal||''}" placeholder="Set goal"></div></div></div><div class="finance-kpis"><div class="finance-kpi expense"><span>EXPENSES</span><strong>${fmt(expense)}</strong></div><div class="finance-kpi income"><span>INCOME</span><strong>${fmt(income)}</strong></div><div class="finance-kpi savings"><span>SAVINGS</span><strong>${fmt(saved)}</strong></div></div><div class="finance-cats"><button class="finance-cat-all ${!selectedFinanceCategory?'active':''}" id="all-fin-transactions">ALL TRANSACTIONS</button>${cats.map(c=>{let spent=all.filter(x=>x.category===c&&x.type==='expense').reduce((s,x)=>s+convertToBase(x.amount,x.currency),0);return `<div class="finance-cat-row"><button class="finance-cat ${selectedFinanceCategory===c?'active':''}" data-fin-cat="${esc(c)}">${esc(c)}</button><span class="cat-spent">${fmt(spent)}</span><button class="cat-menu" data-cat-menu="${esc(c)}">⋮</button></div>`}).join('')}</div><button class="add-btn finance-addcat" id="add-fin-cat">＋ ADD CATEGORY</button></aside></div></section>`} 
function calendarView(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),ds=days(),prevDays=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<42;i++){let n=i-first+1,day=n,date,other=false;if(n<1){day=prevDays+n;date=`${y}-${pad(m)}-${pad(day)}`;other=true}else if(n>ds){day=n-ds;date=`${y}-${pad(m+2>12?1:m+2)}-${pad(day)}`;other=true}else{date=`${y}-${pad(m+1)}-${pad(day)}`}cells.push({day,date,other})}let events=[];d.events.forEach(e=>events.push(...eventOccurrences(e,y,m)));return `<section class="workspace"><div class="workspace-top"><div class="calendar-actions">${monthNav()}<button class="add-btn" id="cal-today">TODAY</button></div><button class="add-btn" id="add-event">＋ ADD EVENT</button></div><div class="calendar-layout"><div class="calendar-scroll"><div class="calendar"><div class="weekday">SUN</div><div class="weekday">MON</div><div class="weekday">TUE</div><div class="weekday">WED</div><div class="weekday">THU</div><div class="weekday">FRI</div><div class="weekday">SAT</div>${cells.map(c=>`<button class="day ${c.other?'other':''}" data-day="${c.date}"><span class="daynum">${c.day}</span><div class="day-events">${events.filter(e=>e.date===c.date).slice(0,3).map(e=>{let o=d.organizers.find(o=>o.id===e.organizerId);return `<div class="event-pill" style="--event-color:${o?.color||'var(--muted)'}">${esc(e.title)}</div>`}).join('')}</div></button>`).join('')}</div></div><aside class="organizers"><h3>ORGANIZERS</h3>${d.organizers.map(o=>`<div class="org"><span class="org-dot" style="--org-color:${o.color}"></span><span class="org-name">${esc(o.name)}</span><button class="more" data-org="${o.id}">⋮</button></div>`).join('')}<button class="add-btn" id="add-org" style="margin-top:17px">＋ ADD ORGANIZER</button></aside></div></section>`}
function tasksView(){let sorted=[...d.tasks].sort((a,b)=>(a.done-b.done)||((a.date||'').localeCompare(b.date||'')));return `<section class="workspace"><div class="tasks-layout"><div class="task-head"><span class="eyebrow">TASKS</span><h1>What needs to happen.</h1></div>${sorted.map(t=>`<div class="task" data-task-row="${t.id}"><button class="task-check" data-task="${t.id}"><i></i></button><input class="task-title-input" data-task-field="title" value="${esc(t.title)}"><input class="task-date-input" data-task-field="date" type="date" value="${t.date||''}"><select class="task-priority-select" data-task-field="priority"><option value="normal" ${t.priority==='normal'?'selected':''}>NORMAL</option><option value="high" ${t.priority==='high'?'selected':''}>HIGH</option></select><button class="task-delete" data-task-delete="${t.id}">×</button></div>`).join('')}<div class="task"><button class="task-check" id="new-task-check"><i></i></button><input class="task-title-input" id="new-task-title" placeholder="Add task…"><input class="task-date-input" id="new-task-date" type="date"><select class="task-priority-select" id="new-task-priority"><option value="normal">NORMAL</option><option value="high">HIGH</option></select><span></span></div><div class="inline-hint">PRESS ENTER TO ADD · ADD AS MANY TASKS AS YOU NEED</div></div></section>`}
function saveNewTransaction(){let desc=document.querySelector('#new-desc')?.value.trim(),amount=Number(document.querySelector('#new-amount')?.value);if(!desc||!Number.isFinite(amount))return;d.transactions.push({id:uid(),description:desc,amount,currency:document.querySelector('#new-cur').value,type:'expense',category:document.querySelector('#new-cat').value,date:document.querySelector('#new-date').value||`${monthKey()}-01`});save();render()}

function categoryMenu(cat){openModal('Edit category',`<div class="field"><label>CATEGORY NAME</label><input id="m-name" value="${esc(cat)}" autofocus></div><button class="secondary" id="delete-cat" style="margin-top:8px">DELETE CATEGORY</button>`,w=>{let v=w.querySelector('#m-name').value.trim();if(!v)return false;if(d.financeCategories.includes(v)&&v!==cat)return false;d.financeCategories=d.financeCategories.map(x=>x===cat?v:x);d.transactions.forEach(x=>{if(x.category===cat)x.category=v});save();render();return true});setTimeout(()=>document.querySelector('#delete-cat')?.addEventListener('click',()=>{if(confirm('Delete this category? Transactions will move to Other.')){d.financeCategories=d.financeCategories.filter(x=>x!==cat);d.transactions.forEach(x=>{if(x.category===cat)x.category='Other'});save();document.querySelector('.modal-wrap')?.remove();render()}}),0)}
function addFinanceCategory(){openModal('Add category',`<div class="field"><label>CATEGORY NAME</label><input id="m-name" autofocus></div>`,w=>{let v=w.querySelector('#m-name').value.trim();if(!v||d.financeCategories.includes(v))return false;d.financeCategories.push(v);save();render();return true})}
function render(){theme();let root=document.querySelector('#root');if(!root)return;let view='';try{view=tab==='habits'?habitView():tab==='finances'?financeView():tab==='calendar'?calendarView():tasksView()}catch(err){console.error('Life OS render error:',err);view=`<section class="workspace"><div class="empty">This section could not be rendered. Try another tab.</div></section>`}try{root.innerHTML=`<div class="app">${header()}${view}<button class="fab" id="settings" aria-label="Settings">⚙</button></div>`}catch(err){console.error('Life OS shell error:',err);root.innerHTML='<div class="app"><section class="workspace"><div class="empty">Life OS encountered a display error.</div></section></div>'}try{bind()}catch(err){console.error('Life OS bind error:',err)}}
function openModal(title,body,onSave){document.body.insertAdjacentHTML('beforeend',`<div class="modal-wrap"><div class="modal"><h2>${title}</h2>${body}<div class="modal-actions"><button class="secondary" data-close>Cancel</button><button class="primary" id="modal-save">Save</button></div></div></div>`);let w=document.querySelector('.modal-wrap');w.querySelector('[data-close]').onclick=()=>w.remove();w.querySelector('#modal-save').onclick=()=>{if(onSave(w))w.remove()}}

function addInlineTransaction(){let host=document.querySelector('#new-tx-row');if(!host)return;host.innerHTML=`<div class="transaction" data-new-tx><input class="tx-input" id="new-desc" placeholder="Item" autofocus><div class="tx-amount"><input class="tx-input" id="new-amount" type="number" step="0.01" placeholder="Amount"><select class="tx-select tx-cur" id="new-cur">${Object.keys(currencies).map(c=>`<option ${d.baseCurrency===c?'selected':''}>${c}</option>`).join('')}</select></div><select class="tx-select" id="new-cat"><option>Groceries</option><option>Daily Life</option><option>Savings</option><option>Education</option><option>Transport</option><option>Food</option><option>Other</option></select><input class="tx-input" id="new-date" type="date" value="${monthKey()}-${pad(Math.min(new Date().getDate(),days()))}"><button class="tx-delete" id="cancel-new-tx">×</button></div>`;document.querySelector('#cancel-new-tx').onclick=()=>{host.innerHTML=''};let saveNew=()=>{let desc=document.querySelector('#new-desc').value.trim(),amount=Number(document.querySelector('#new-amount').value);if(!desc||!Number.isFinite(amount))return;d.transactions.push({id:uid(),description:desc,amount,currency:document.querySelector('#new-cur').value,type:'expense',category:document.querySelector('#new-cat').value,date:document.querySelector('#new-date').value});save();render()};document.querySelector('#new-desc').addEventListener('keydown',e=>{if(e.key==='Enter')saveNew()});document.querySelector('#new-amount').addEventListener('keydown',e=>{if(e.key==='Enter')saveNew()})}

function txModal(edit){let x=edit||{type:'expense',currency:'RUB',category:'Other',date:`${monthKey()}-${pad(new Date().getDate())}`};let cats=['Groceries','Food','Transport','Education','Shopping','Entertainment','Bills','Rent','Savings','Salary','Freelance','Other',...d.organizers.map(o=>o.name)];openModal(edit?'Edit transaction':'Add transaction',`<div class="field"><label>DESCRIPTION</label><input id="m-desc" value="${esc(x.description||'')}" autofocus></div><div class="field"><label>AMOUNT</label><input id="m-amount" type="number" step="0.01" value="${x.amount??''}"></div><div class="field"><label>CURRENCY</label><select id="m-cur">${Object.keys(currencies).map(c=>`<option ${x.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>TYPE</label><select id="m-type"><option value="expense" ${x.type==='expense'?'selected':''}>Expense</option><option value="income" ${x.type==='income'?'selected':''}>Income</option></select></div><div class="field"><label>CATEGORY</label><select id="m-cat">${[...new Set(cats)].map(c=>`<option ${x.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>DATE</label><input id="m-date" type="date" value="${x.date||''}"></div>`,w=>{let amount=Number(w.querySelector('#m-amount').value),desc=w.querySelector('#m-desc').value.trim();if(!desc||!Number.isFinite(amount)||amount<0)return false;Object.assign(x,{description:desc,amount,currency:w.querySelector('#m-cur').value,type:w.querySelector('#m-type').value,category:w.querySelector('#m-cat').value,date:w.querySelector('#m-date').value||`${monthKey()}-01`,amountBase:convertToBase(amount,w.querySelector('#m-cur').value)});if(!edit)d.transactions.push(x);save();render();return true})}
function eventOccurrences(e,y,m){let out=[],start=new Date((e.date||'')+'T00:00:00');if(Number.isNaN(start.getTime()))return out;let type=e.repeat?.type||'none',interval=Math.max(1,Number(e.repeat?.interval)||1),unit=e.repeat?.unit||'days',startDay=new Date(start.getFullYear(),start.getMonth(),start.getDate());if(type==='none'){if(start.getFullYear()===y&&start.getMonth()===m)out.push({...e,_occurrence:e.date});return out}let daysIn=new Date(y,m+1,0).getDate();for(let day=1;day<=daysIn;day++){let cur=new Date(y,m,day);if(cur<startDay)continue;let diff=Math.floor((cur-startDay)/86400000),ok=false;if(type==='daily'||(type==='custom'&&unit==='days'))ok=diff%interval===0;else if(type==='weekly'||(type==='custom'&&unit==='weeks'))ok=diff%(7*interval)===0;else if(type==='monthly'||(type==='custom'&&unit==='months')){let months=(cur.getFullYear()-startDay.getFullYear())*12+cur.getMonth()-startDay.getMonth();ok=cur.getDate()===startDay.getDate()&&months>=0&&months%interval===0}if(ok)out.push({...e,date:`${y}-${pad(m+1)}-${pad(day)}`,_occurrence:`${y}-${pad(m+1)}-${pad(day)}`})}return out}
function eventModal(date,edit){let e=edit||{date:date||`${monthKey()}-01`,time:'09:00',organizerId:d.organizers[0]?.id,repeat:{type:'none'}};let r=e.repeat||{type:'none'};openModal(edit?'Edit event':'Add event',`<div class="field"><label>TITLE</label><input id="m-title" value="${esc(e.title||'')}" autofocus></div><div class="field"><label>DATE</label><input id="m-date" type="date" value="${e.date}"></div><div class="field"><label>TIME</label><input id="m-time" type="time" value="${e.time||'09:00'}"></div><div class="field"><label>ORGANIZER</label><select id="m-org">${d.organizers.map(o=>`<option value="${o.id}" ${e.organizerId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div class="field"><label>REPEAT</label><select id="m-repeat"><option value="none" ${r.type==='none'?'selected':''}>Does not repeat</option><option value="daily" ${r.type==='daily'?'selected':''}>Daily</option><option value="weekly" ${r.type==='weekly'?'selected':''}>Weekly</option><option value="monthly" ${r.type==='monthly'?'selected':''}>Monthly</option><option value="custom" ${r.type==='custom'?'selected':''}>Custom</option></select></div><div class="field" id="repeat-custom" style="display:${r.type==='custom'?'block':'none'}"><label>CUSTOM INTERVAL</label><div style="display:flex;gap:8px"><input id="m-repeat-interval" type="number" min="1" step="1" value="${r.interval||1}" style="max-width:100px"><select id="m-repeat-unit"><option value="days" ${r.unit==='days'?'selected':''}>days</option><option value="weeks" ${r.unit==='weeks'?'selected':''}>weeks</option><option value="months" ${r.unit==='months'?'selected':''}>months</option></select></div></div><div class="field"><label>NOTES</label><textarea id="m-notes">${esc(e.notes||'')}</textarea></div>`,w=>{let title=w.querySelector('#m-title').value.trim();if(!title)return false;let type=w.querySelector('#m-repeat').value;Object.assign(e,{title,date:w.querySelector('#m-date').value,time:w.querySelector('#m-time').value,organizerId:w.querySelector('#m-org').value,notes:w.querySelector('#m-notes').value,repeat:type==='none'?{type:'none'}:{type,interval:type==='custom'?Math.max(1,Number(w.querySelector('#m-repeat-interval').value)||1):1,unit:type==='custom'?w.querySelector('#m-repeat-unit').value:(type==='daily'?'days':type==='weekly'?'weeks':'months')}});if(!edit)d.events.push(e);save();render();return true});setTimeout(()=>{let sel=document.querySelector('#m-repeat'),box=document.querySelector('#repeat-custom');sel?.addEventListener('change',()=>{if(box)box.style.display=sel.value==='custom'?'block':'none'})},0)}
function orgMenu(id){let o=d.organizers.find(x=>x.id===id);openModal('Edit organizer',`<div class="field"><label>NAME</label><input id="m-name" value="${esc(o.name)}"></div><div class="field"><label>COLOR</label><div class="color-row">${orgColors.map(c=>`<button class="color-choice ${o.color===c?'selected':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div></div>`,w=>{let name=w.querySelector('#m-name').value.trim();if(!name)return false;o.name=name;o.color=w.querySelector('[data-color].selected')?.dataset.color||o.color;save();render();return true});document.querySelectorAll('.color-choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.color-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}
function taskModal(edit){let t=edit||{date:'',priority:'normal'};openModal(edit?'Edit task':'Add task',`<div class="field"><label>TASK</label><input id="m-title" value="${esc(t.title||'')}" autofocus></div><div class="field"><label>DUE DATE</label><input id="m-date" type="date" value="${t.date||''}"></div><div class="field"><label>PRIORITY</label><select id="m-priority"><option value="normal" ${t.priority==='normal'?'selected':''}>Normal</option><option value="high" ${t.priority==='high'?'selected':''}>High</option></select></div>`,w=>{let title=w.querySelector('#m-title').value.trim();if(!title)return false;Object.assign(t,{title,date:w.querySelector('#m-date').value,priority:w.querySelector('#m-priority').value});if(!edit){t.id=uid();t.done=false;d.tasks.push(t)}save();render();return true})}
function settings(){document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><aside class="drawer"><div class="drawer-head"><div><span class="eyebrow">SETTINGS</span><h2>Make it yours.</h2></div><button class="close" id="close-settings">×</button></div><div class="field"><label>NAME</label><input id="s-name" value="${esc(d.name)}"></div><div class="field"><label>QUOTE</label><input id="s-quote" value="${esc(d.quote)}"></div><div class="field"><label>TIMEZONE</label><select id="s-zone"><option value="auto">Automatic · ${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</option>${['Europe/Berlin','Asia/Kolkata','Europe/Moscow','America/New_York','America/Los_Angeles'].map(z=>`<option value="${z}" ${d.timezone===z?'selected':''}>${z}</option>`).join('')}</select></div><div class="field"><label>APPEARANCE</label><select id="s-theme"><option value="system" ${d.theme==='system'?'selected':''}>System</option><option value="dark" ${d.theme==='dark'?'selected':''}>Dark</option><option value="light" ${d.theme==='light'?'selected':''}>Light</option></select></div><div class="field"><label>BASE CURRENCY</label><select id="s-cur">${Object.keys(currencies).map(c=>`<option ${d.baseCurrency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="setting-section"><span class="eyebrow">TAB ORDER</span>${d.tabOrder.map((x,i)=>`<div class="order-row"><b>${x.toUpperCase()}</b><button class="mini" data-up="${i}" ${i===0?'disabled':''}>↑</button><button class="mini" data-down="${i}" ${i===d.tabOrder.length-1?'disabled':''}>↓</button></div>`).join('')}</div><div class="setting-section"><span class="eyebrow">ACCOUNT</span><div id="account-box" style="margin-top:12px"></div></div><div class="setting-section"><span class="eyebrow">DATA</span><div class="drawer-actions" style="margin-top:14px"><button class="secondary" id="export">EXPORT JSON</button><label class="secondary" style="cursor:pointer">IMPORT JSON<input id="import" type="file" accept="application/json" style="display:none"></label><button class="secondary" id="reset">RESET</button></div></div></aside></div>`);let o=document.querySelector('.overlay');document.querySelector('#close-settings').onclick=()=>o.remove();const refresh=()=>{save();o.remove();render()};document.querySelector('#s-name').onchange=e=>{d.name=e.target.value.trim()||'SRI';refresh()};document.querySelector('#s-quote').onchange=e=>{d.quote=e.target.value;refresh()};document.querySelector('#s-zone').onchange=e=>{d.timezone=e.target.value;refresh()};document.querySelector('#s-theme').onchange=e=>{d.theme=e.target.value;save();theme()};document.querySelector('#s-cur').onchange=e=>{d.baseCurrency=e.target.value;refresh()};document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;[d.tabOrder[i-1],d.tabOrder[i]]=[d.tabOrder[i],d.tabOrder[i-1]];if(tab===d.tabOrder[i])tab=d.tabOrder[i-1];refresh()});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let i=+b.dataset.down;[d.tabOrder[i],d.tabOrder[i+1]]=[d.tabOrder[i+1],d.tabOrder[i]];if(tab===d.tabOrder[i+1])tab=d.tabOrder[i];refresh()});document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='life-os-backup.json';a.click()};document.querySelector('#import').onchange=e=>{let f=e.target.files?.[0];if(f)f.text().then(t=>{try{d={...defaults,...JSON.parse(t)};save();o.remove();render()}catch{alert('Invalid backup file')}})};const accountBox=document.querySelector('#account-box');
const renderAccountBox=()=>{if(!accountBox)return; if(account?.user){accountBox.innerHTML=`<div style="font-size:11px;line-height:1.6">Signed in as <strong>${esc(account.user.email||'')}</strong></div><div class="drawer-actions" style="margin-top:12px"><button class="secondary" id="account-signout">SIGN OUT</button></div>`;document.querySelector('#account-signout').onclick=async()=>{await accountSignOut();o.remove();render()}}else{accountBox.innerHTML=`<div style="font-size:11px;color:var(--muted);line-height:1.6">Not signed in.</div><div class="drawer-actions" style="margin-top:12px"><button class="secondary" id="account-setup">ACCOUNT SETUP</button></div>`;document.querySelector('#account-setup').onclick=async()=>{if(!accountReady()){alert('Account sync needs a Supabase project URL and anon key in SUPABASE_CONFIG before accounts can be enabled.');return}const email=prompt('Email address');if(!email)return;const password=prompt('Password (minimum 6 characters)');if(!password)return;const r=await accountSignIn(email,password);if(r.error){const s=await accountSignUp(email,password);if(s.error){alert(s.error.message);return}alert('Account created. Check your email if confirmation is enabled.');const u=await accountSession();if(u){account.user=u;await accountPull();}renderAccountBox()}else{account.user=r.data.user;await accountPull();alert('Signed in and synced.');renderAccountBox()}}};};
renderAccountBox();
document.querySelector('#reset').onclick=()=>{if(confirm('Reset all Life OS data?')){localStorage.removeItem(KEY);location.reload()}}}
function bind(){document.querySelectorAll('.nav [data-tab]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();let next=b.dataset.tab;if(!d.tabOrder.includes(next)||tab===next)return;tab=next;render()}));document.querySelector('#finance-goal-input')?.addEventListener('change',e=>{let v=Number(e.target.value);d.financeGoals??={};if(Number.isFinite(v)&&v>0)d.financeGoals[monthKey()]=v;else delete d.financeGoals[monthKey()];save();render()});document.querySelector('[data-month="prev"]')?.addEventListener('click',()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()});document.querySelector('[data-month="next"]')?.addEventListener('click',()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()});document.querySelector('#name')?.addEventListener('click',()=>{let v=prompt('Your name',d.name);if(v?.trim()){d.name=v.trim();save();render()}});document.querySelector('#quote')?.addEventListener('click',()=>{let v=prompt('Your quote',d.quote);if(v!==null){d.quote=v;save();render()}});document.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>{let [id,day]=b.dataset.dot.split(':');d.completions[monthKey()]??={};d.completions[monthKey()][id]??={};d.completions[monthKey()][id][day]=!d.completions[monthKey()][id][day];save();render()});document.querySelector('#add-habit')?.addEventListener('click',()=>habitModal());document.querySelectorAll('[data-hrename]').forEach(b=>b.onclick=()=>habitModal(d.habits.find(h=>h.id===b.dataset.hrename)));document.querySelectorAll('[data-hdelete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this habit?')){d.habits=d.habits.filter(h=>h.id!==b.dataset.hdelete);save();render()}});document.querySelectorAll('[data-hmove]').forEach(b=>b.onclick=()=>{let [id,dir]=b.dataset.hmove.split(':');let a=[...d.habits].sort((x,y)=>x.order-y.order),i=a.findIndex(h=>h.id===id),j=dir==='up'?i-1:i+1;if(j>=0&&j<a.length){[a[i].order,a[j].order]=[a[j].order,a[i].order];save();render()}});
document.querySelectorAll('[data-tx-field]').forEach(el=>el.addEventListener('change',()=>{let row=el.closest('[data-tx-row]');if(row)updateTransaction(row.dataset.txRow,el.dataset.txField,el.value)}));document.querySelectorAll('[data-tx-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this transaction?')){d.transactions=d.transactions.filter(x=>x.id!==b.dataset.txDelete);save();render()}});document.querySelectorAll('[data-tx-type]').forEach(b=>b.onclick=()=>{let x=d.transactions.find(t=>t.id===b.dataset.txType);if(x){x.type=x.type==='income'?'expense':'income';save();render()}});document.querySelector('#new-desc')?.addEventListener('input',e=>{let cat=document.querySelector('#new-cat');if(cat&&!e.target.dataset.manual){let guess=autoCategory(e.target.value);if([...cat.options].some(o=>o.value===guess))cat.value=guess}});document.querySelector('#new-desc')?.addEventListener('keydown',e=>{if(e.key==='Enter')saveNewTransaction()});document.querySelector('#new-amount')?.addEventListener('keydown',e=>{if(e.key==='Enter')saveNewTransaction()});document.querySelectorAll('[data-fin-cat]').forEach(b=>b.onclick=()=>{selectedFinanceCategory=selectedFinanceCategory===b.dataset.finCat?null:b.dataset.finCat;render()});document.querySelector('#all-fin-transactions')?.addEventListener('click',()=>{selectedFinanceCategory=null;render()});document.querySelector('#add-fin-cat')?.addEventListener('click',()=>addFinanceCategory());document.querySelectorAll('[data-cat-menu]').forEach(b=>b.onclick=()=>categoryMenu(b.dataset.catMenu));
document.querySelector('#add-event')?.addEventListener('click',()=>eventModal());document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>eventModal(b.dataset.day));document.querySelector('#cal-today')?.addEventListener('click',()=>{let n=new Date();month=new Date(n.getFullYear(),n.getMonth(),1);render()});document.querySelector('#add-org')?.addEventListener('click',()=>{openModal('Add organizer',`<div class="field"><label>NAME</label><input id="m-name" autofocus></div><div class="field"><label>COLOR</label><div class="color-row">${orgColors.map((c,i)=>`<button class="color-choice ${i===0?'selected':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div></div>`,w=>{let name=w.querySelector('#m-name').value.trim();if(!name)return false;d.organizers.push({id:uid(),name,color:w.querySelector('[data-color].selected')?.dataset.color||orgColors[0]});save();render();return true});document.querySelectorAll('.color-choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.color-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})});document.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>orgMenu(b.dataset.org));document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let t=d.tasks.find(t=>t.id===b.dataset.task);t.done=!t.done;save();render()});document.querySelectorAll('[data-task-row]').forEach(row=>row.querySelectorAll('[data-task-field]').forEach(el=>el.onchange=()=>updateTask(row.dataset.taskRow,el.dataset.taskField,el.value)));document.querySelectorAll('[data-task-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this task?')){d.tasks=d.tasks.filter(x=>x.id!==b.dataset.taskDelete);save();render()}});document.querySelector('#new-task-title')?.addEventListener('keydown',e=>{if(e.key==='Enter')saveNewTask()});document.querySelector('#settings')?.addEventListener('click',settings)}

if(accountReady())accountSession().then(async u=>{if(u){await accountPull();render()}}).catch(()=>{});
setInterval(()=>{let el=document.querySelector('.datebox');if(el){let p=dateParts(),o=Object.fromEntries(p.map(x=>[x.type,x.value]));el.innerHTML=`<strong>${o.weekday}</strong><strong>${o.day} ${o.month.toUpperCase()} ${o.year}</strong><span class="time">${clock()}</span>`}},30000);render();
</script></body></html>
